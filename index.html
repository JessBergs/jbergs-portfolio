      <h1>Jess Bergs</h1>
      <p>R&D Engineering Lead. Human-AI Interaction @ UK AI Security Institute.</p>
      <h2>Hi, there!</h2>
      <p>I lead engineering &amp; product strategy for our human-in-the-loop research tools, enabling our scientists to
        source empirical data for their groundbreaking AI security research experiments at scale.<br>
        I'm currently working on human oversight for our increasingly automated research workflows, and keeping researchers
        meaningfully involved in those.</p>
      <p>My career so far has been spanning R&amp;D and public sector innovation, from EU Horizon projects to Explainable AI
        at BBC R&amp;D and since 2024 technical AI safety in the British government.</p>
      <p>I'm mentoring at BlueDot Impact's <a href="https://bluedot.org/courses/technical-ai-safety-project">Technical AI
          Safety Project</a> programme, <a href="https://algoverseairesearch.org/">Algoverse AI Research</a> and from this
        Autumn also <a href="https://sparai.org/">SPAR</a>.</p>
      <p>I'm a proud generalist and love bringing people together through events &amp; conferences I (co-)organise. Outside
        work, I design and playtest board games.</p>
