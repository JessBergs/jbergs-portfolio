<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V4 · Speaker page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* V4: the speaker / practitioner dialect (conference sites, Rumman Chowdhury's "Featured at"):
     a slim "Next up" announcement bar, a horizontal rail of event cards with colour-coded role badges,
     and a "Working with" wordmark strip in place of logos. Tiles are grouped by year, with everything
     before 2025 collapsed behind a disclosure so the page stops growing downwards. */
  .announce { border-bottom: 1px solid var(--color-line); background: rgba(255, 255, 255, 0.55); }
  .announce .wrap { display: flex; align-items: center; gap: 0.75rem; padding-top: 0.5rem; padding-bottom: 0.5rem; font-size: 0.82rem; font-weight: 500; }
  .announce .dot { width: 8px; height: 8px; border-radius: 50%; background: #e8945f; box-shadow: 0 0 0 4px rgba(232, 148, 95, 0.2); }
  .announce b { font-weight: 600; }
  .announce .when { font-family: var(--font-mono); font-size: 0.74rem; color: var(--color-ink-mute); }
  .announce a { margin-left: auto; font-size: 0.78rem; color: var(--color-ink-mute); text-decoration: none; }
  .top { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; padding: 2.25rem 0 2rem; align-items: start; }
  #upcoming { padding: 0.5rem 0 2rem; }
  .rail-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1rem; }
  .rail-head a { font-size: 0.78rem; color: var(--color-ink-mute); text-decoration: none; }
  .rail { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0.9rem; }
  .ev { background: rgba(254, 252, 249, 0.75); border: 1px solid var(--color-line); border-radius: 14px; padding: 0.9rem 1rem 1rem; display: flex; flex-direction: column; gap: 0.35rem; min-height: 9rem; text-decoration: none; color: var(--color-ink); }
  .ev-date { font-family: var(--font-serif); font-size: 1.9rem; line-height: 1; color: #1d2029; }
  .ev-date small { font-family: var(--font-sans); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; margin-left: 0.3rem; color: var(--color-ink-mute); }
  .ev .t { font-size: 0.88rem; font-weight: 600; line-height: 1.3; margin-top: 0.2rem; }
  .ev .w { font-size: 0.76rem; color: var(--color-ink-mute); font-weight: 500; flex: 1; }
  .ev .kind { align-self: flex-start; }
  .with { padding: 0.5rem 0 2.25rem; }
  .wordmarks { display: flex; flex-wrap: wrap; gap: 0.9rem 2.5rem; margin-top: 0.75rem; align-items: flex-start; }
  .wordmarks li { display: flex; flex-direction: column; gap: 0.1rem; }
  .wordmarks .wm { font-family: var(--font-serif); font-size: 1.15rem; color: #1d2029; letter-spacing: -0.01em; }
  .wordmarks .r { font-size: 0.68rem; color: var(--color-ink-mute); font-weight: 500; }
  #work { padding: 3rem 0 1rem; }
  .year { font-family: var(--font-mono); font-size: 0.78rem; color: var(--color-ink-mute); letter-spacing: 0.04em; margin: 2.25rem 0 1rem; display: flex; align-items: center; gap: 1rem; }
  .year::after { content: ''; flex: 1; border-top: 1px solid var(--color-line); }
  .year:first-of-type { margin-top: 0; }
  details.earlier summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.6rem; margin-top: 2.25rem; padding: 0.6rem 1.1rem; border-radius: 999px; border: 1px solid var(--color-line-strong); background: rgba(255,255,255,0.7); font-size: 0.85rem; font-weight: 500; }
  details.earlier summary::-webkit-details-marker { display: none; }
  details.earlier .tiles { margin-top: 1.25rem; }
  @media (max-width: 72rem) { .rail { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 64rem) { .top { grid-template-columns: 1fr; gap: 2.5rem; } }
  @media (max-width: 40rem) { .rail { grid-template-columns: 1fr 1fr; } .announce a { display: none; } }
</style>
</head>
<body>
<div id="header"></div>
<div class="announce"><div class="wrap"><span class="dot"></span><b>Next up</b> Talk at Liftoff <span class="when">Thu 12 Nov</span><a href="#upcoming">all upcoming →</a></div></div>
<main>
  <div class="wrap">
    <div class="top">
      <div id="hero"></div>
      <div id="about"></div>
    </div>

    <section id="upcoming">
      <div class="rail-head"><h2 class="section-h2">Upcoming</h2><a href="#">past talks &amp; events →</a></div>
      <ul class="rail" id="rail"></ul>
    </section>

    <section class="with" aria-label="Current roles">
      <span class="eyebrow">Working with</span>
      <ul class="wordmarks" id="wordmarks"></ul>
    </section>

    <hr class="rule">

    <section id="work">
      <h2 class="section-h2" style="margin-bottom:2rem">Selected Work</h2>
      <div id="filters"></div>
      <h3 class="year">2026</h3>
      <ul class="tiles" id="t2026"></ul>
      <h3 class="year">2025</h3>
      <ul class="tiles" id="t2025"></ul>
      <details class="earlier">
        <summary>Earlier work · 2011–2021 · 8 projects ↓</summary>
        <ul class="tiles" id="tearlier"></ul>
      </details>
    </section>
  </div>
</main>
<div id="footer"></div>
<div class="mock-label">V4 · speaker page</div>

<script src="data.js"></script>
<script>
  document.getElementById('header').innerHTML = renderHeader(['About', 'Upcoming', 'Work', 'Contact']);
  document.getElementById('hero').innerHTML = renderHero();
  document.getElementById('about').innerHTML = renderAbout(['work', 'research', 'career', 'generalist']);
  document.getElementById('rail').innerHTML = UPCOMING.map((e) => `<li><a class="ev" href="#">
      <div class="ev-date">${e.day}<small>${e.mon}</small></div>
      <span class="${kindClass(e.kind)}">${e.kind}</span>
      <div class="t">${e.title}</div>
      <div class="w">${[e.where, e.tbc ? 'date tbc' : ''].filter(Boolean).join(' · ')}</div>
    </a></li>`).join('');
  document.getElementById('wordmarks').innerHTML = ROLES.filter((r) => r.org !== 'UK AI Security Institute')
    .map((r) => `<li><span class="wm">${r.org}</span><span class="r">${r.role}${/Q1/.test(r.since) ? ' · ' + r.since : ''}</span></li>`).join('');
  document.getElementById('filters').innerHTML = renderFilters();
  const by = (f) => PROJECTS.filter(f).map((p) => renderTile(p)).join('');
  document.getElementById('t2026').innerHTML = by((p) => p.year === '2026');
  document.getElementById('t2025').innerHTML = by((p) => p.year === '2025');
  document.getElementById('tearlier').innerHTML = by((p) => p.year !== '2026' && p.year !== '2025');
  document.getElementById('footer').innerHTML = renderFooter();
</script>
</body>
</html>
