<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V2 · Agenda sidebar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* V2: the lab / department-page dialect. Three columns above the fold: identity, bio, and an
     "Upcoming" agenda card with calendar-block dates (big day, small month). Roles run as a
     chip strip under it. Tiles go compact and four-up so 20 fit in five rows. */
  .top3 { display: grid; grid-template-columns: 1fr 1.45fr 1.05fr; gap: 3.25rem; padding: 2.25rem 0 2rem; align-items: start; }
  .agenda { background: rgba(254, 252, 249, 0.7); border: 1px solid var(--color-line); border-radius: 14px; padding: 1.1rem 1.25rem 1rem; }
  .agenda-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.5rem; }
  .agenda-head a { font-size: 0.74rem; color: var(--color-ink-mute); text-decoration: none; }
  .cal { display: grid; grid-template-columns: 3.1rem 1fr; gap: 0.8rem; padding: 0.6rem 0; border-top: 1px solid var(--color-line); align-items: start; }
  .cal-date { text-align: center; border-radius: 8px; background: #fff; border: 1px solid var(--color-line); padding: 0.3rem 0 0.35rem; line-height: 1; }
  .cal-date .d { font-family: var(--font-serif); font-size: 1.3rem; display: block; color: #1d2029; }
  .cal-date--q .d { font-size: 1.05rem; padding-top: 0.15rem; }
  .cal-date--q .m { font-size: 0.62rem; letter-spacing: 0.04em; }
  .cal-date .m { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-ink-mute); display: block; margin-top: 0.2rem; }
  .cal-body .t { font-size: 0.9rem; font-weight: 600; line-height: 1.3; }
  .cal-body .w { font-size: 0.78rem; color: var(--color-ink-mute); font-weight: 500; margin-top: 0.15rem; }
  .cal-body .kind { margin-left: 0.35rem; position: relative; top: -1px; }
  .now-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.6rem; padding: 0.25rem 0 2.25rem; }
  .now-strip .eyebrow { margin-right: 0.5rem; }
  .chip { display: inline-flex; gap: 0.4rem; align-items: baseline; padding: 0.35rem 0.8rem; border-radius: 999px; background: rgba(255, 255, 255, 0.65); border: 1px solid var(--color-line); font-size: 0.8rem; font-weight: 500; text-decoration: none; color: var(--color-ink); }
  .chip b { font-weight: 600; }
  .chip span { color: var(--color-ink-mute); }
  #work { padding: 3rem 0 1rem; }
  .tiles--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.1rem; }
  @media (max-width: 72rem) { .top3 { grid-template-columns: 1fr 1fr; } .agenda { grid-column: 1 / -1; } .tiles--4 { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 48rem) { .top3 { grid-template-columns: 1fr; gap: 2.25rem; } .top3 > #about { order: 3; } .agenda { order: 2; } .tiles--4 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 40rem) { .tiles--4 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="header"></div>
<main>
  <div class="wrap">
    <div class="top3">
      <div id="hero"></div>
      <div id="about"></div>
      <aside class="agenda" id="upcoming" aria-labelledby="agenda-title">
        <div class="agenda-head"><h2 id="agenda-title" class="section-h2">Upcoming</h2><a href="#">all events →</a></div>
        <ol id="cal"></ol>
      </aside>
    </div>

    <div class="now-strip" id="roles"></div>

    <hr class="rule">

    <section id="work">
      <h2 class="section-h2" style="margin-bottom:2rem">Selected Work</h2>
      <div id="filters"></div>
      <ul class="tiles tiles--4" id="tiles"></ul>
    </section>
  </div>
</main>
<div id="footer"></div>
<div class="mock-label">V2 · agenda sidebar</div>

<script src="data.js"></script>
<script>
  document.getElementById('header').innerHTML = renderHeader(['About', 'Upcoming', 'Work', 'Contact']);
  document.getElementById('hero').innerHTML = renderHero();
  document.getElementById('about').innerHTML = renderAbout(['work', 'research', 'career', 'generalist']);
  document.getElementById('cal').innerHTML = UPCOMING.map((e) => `<li class="cal">
      <div class="cal-date${e.quarter ? ' cal-date--q' : ''}"><span class="d">${e.day}</span><span class="m">${e.mon}</span></div>
      <div class="cal-body"><div class="t">${e.title}<span class="${kindClass(e.kind)}">${e.kind}</span></div>
      <div class="w">${[e.where, e.tbc ? 'date tbc' : ''].filter(Boolean).join(' · ')}</div></div>
    </li>`).join('');
  document.getElementById('roles').innerHTML = '<span class="eyebrow">Currently</span>' + ROLES.map((r) => `<a class="chip" href="#"><b>${r.org}</b><span>${r.role.split(',')[0]}</span></a>`).join('');
  document.getElementById('filters').innerHTML = renderFilters();
  document.getElementById('tiles').innerHTML = PROJECTS.map((p) => renderTile(p, { compact: true })).join('');
  document.getElementById('footer').innerHTML = renderFooter();
</script>
</body>
</html>
