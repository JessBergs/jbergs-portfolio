<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jess Bergs · Deck</title>
<link rel="stylesheet" href="base.css">
<style>
  /* A · Deck. Every entry is a playing card: fixed 5:7 face, corner indices, a suit colour by kind.
     The upcoming events are the hand being held; the roles are tokens on the board; past work is
     the cards already played. No banner images, only a small round crest cut from each one. */
  body { background-image: radial-gradient(rgba(29,32,41,.10) 1px, transparent 1.4px); background-size: 26px 26px; }
  .top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 3rem; align-items: center; padding-top: 3.25rem; padding-bottom: 1.5rem; }
  .top > * { min-width: 0; }
  h1 { font-size: 3.4rem; line-height: 1; letter-spacing: -0.01em; }
  .intro { max-width: 30rem; margin-top: 1.1rem; font-size: 1.08rem; line-height: 1.55; color: var(--ink-2); }
  .links { display: flex; flex-wrap: wrap; gap: 0.35rem 1.4rem; margin-top: 1.4rem; font-size: 0.95rem; }
  h2 { font-size: 1.05rem; font-style: italic; color: var(--ink-3); }
  .hand h2 { margin-bottom: 0.25rem; }
  .fan { position: relative; height: 300px; }
  .fan li { position: absolute; bottom: 0; left: calc(50% - 78px); transform-origin: 50% 125%; transition: transform .25s ease; }
  .fan li:hover, .fan li:focus-within { z-index: 10; }
  .card { display: flex; flex-direction: column; justify-content: center; width: 156px; aspect-ratio: 5 / 7; padding: 14px 13px; border-radius: 10px; background: var(--wash); color: var(--ink); text-decoration: none; position: relative;
    box-shadow: inset 0 0 0 1px rgba(29,32,41,.16), inset 0 0 0 7px var(--wash), inset 0 0 0 8px rgba(29,32,41,.16), 0 10px 24px rgba(29,32,41,.10); transition: transform .25s ease; }
  .fan .card:hover, .fan .card:focus-visible { transform: translateY(-18px); }
  .idx { position: absolute; top: 11px; left: 12px; line-height: 1; text-align: center; }
  .idx b { display: block; font-size: 1.45rem; }
  .idx small { display: block; font-size: 0.66rem; margin-top: 2px; color: var(--pen); }
  .idx--b { top: auto; left: auto; bottom: 11px; right: 12px; transform: rotate(180deg); }
  .face { text-align: center; padding: 0 2px; }
  .face > * { display: block; }
  .face .t { font-weight: 700; font-size: 0.92rem; line-height: 1.2; }
  .face .p { font-size: 0.85rem; color: var(--ink-2); margin-top: 0.3rem; }
  .face .r { font-size: 0.8rem; font-style: italic; margin-top: 0.45rem; color: var(--pen); }
  .face .crest { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; margin: 0 auto 0.6rem; box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px rgba(29,32,41,.18); }
  .board { padding: 1rem 0 2rem; border-top: 1px solid var(--line); margin-top: 1.5rem; }
  .board h2 { margin-bottom: 0.75rem; }
  .tokens { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: 0.6rem 2rem; }
  .tokens li { display: flex; align-items: center; gap: 0.7rem; }
  .tok { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--wash); box-shadow: inset 0 0 0 1px rgba(29,32,41,.2), inset 0 -3px 0 rgba(29,32,41,.08); font-size: 0.66rem; font-weight: 700; letter-spacing: 0.02em; color: var(--pen); }
  .tok--future { background: var(--paper); box-shadow: inset 0 0 0 1px var(--pen); }
  .tokens .o { font-size: 0.98rem; }
  .tokens .rl { display: block; font-size: 0.82rem; color: var(--ink-2); }
  .played { padding: 1.5rem 0 3rem; border-top: 1px solid var(--line); }
  .played-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1.1rem; }
  .suits { font-size: 0.92rem; color: var(--ink-2); }
  .suits span { text-decoration: underline; text-decoration-color: var(--pen); text-decoration-thickness: 3px; text-underline-offset: 0.2em; margin-right: 0.9rem; color: var(--ink); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 1rem; }
  .cards .card { width: 100%; box-shadow: inset 0 0 0 1px rgba(29,32,41,.16), inset 0 0 0 7px var(--wash), inset 0 0 0 8px rgba(29,32,41,.16); }
  .cards .card:hover { transform: translateY(-4px); box-shadow: inset 0 0 0 1px rgba(29,32,41,.16), inset 0 0 0 7px var(--wash), inset 0 0 0 8px rgba(29,32,41,.16), 0 10px 24px rgba(29,32,41,.10); }
  .cards .face .t { font-size: 0.9rem; }
  .cards .face .p { font-size: 0.78rem; }
  footer { padding: 1rem 0 2rem; font-size: 0.85rem; color: var(--ink-3); }
  @media (max-width: 64rem) { .top { grid-template-columns: 1fr; } .fan { height: auto; display: flex; gap: 0.75rem; overflow-x: auto; padding: 0.5rem 0 1rem; } .fan li { position: static; transform: none !important; flex: none; } }
  @media (max-width: 40rem) { h1 { font-size: 2.6rem; } }
</style>
</head>
<body>
<header class="wrap top">
  <div>
    <h1>Jess Bergs</h1>
    <p class="intro" id="intro"></p>
    <p class="links" id="links"></p>
  </div>
  <section class="hand" aria-labelledby="hand-h">
    <h2 id="hand-h">In hand</h2>
    <ul class="fan" id="fan"></ul>
  </section>
</header>
<main>
  <section class="wrap board" aria-labelledby="board-h">
    <h2 id="board-h">On the board</h2>
    <ul class="tokens" id="tokens"></ul>
  </section>
  <section class="wrap played" aria-labelledby="played-h">
    <div class="played-head"><h2 id="played-h">Played</h2><p class="suits" id="suits"></p></div>
    <ul class="cards" id="cards"></ul>
  </section>
</main>
<footer class="wrap">© 2026 Jessica Bergs</footer>
<div class="mock-label">A · deck</div>
<script src="entries.js"></script>
<script>
  document.getElementById('intro').textContent = INTRO;
  document.getElementById('links').innerHTML = linksHtml();
  const angles = [-12, -7, -2, 2, 7, 12];
  document.getElementById('fan').innerHTML = UPCOMING.map((e, i) => `<li style="transform: translateX(${(i - 2.5) * 100}px) rotate(${angles[i]}deg) translateY(${Math.abs(angles[i]) * 1.2}px)">
      <a class="card k-${e.kind}" href="#">
        <span class="idx"><b>${e.day}</b><small>${e.mon}</small></span>
        <span class="face"><span class="t">${esc(e.title)}</span>${e.place ? `<span class="p">${e.place}</span>` : ''}<span class="r">${e.role}${e.tbc ? ', date tbc' : ''}</span></span>
        <span class="idx idx--b"><b>${e.day}</b><small>${e.mon}</small></span>
      </a></li>`).join('');
  document.getElementById('tokens').innerHTML = ROLES.map((r) => `<li class="k-${r.kind}"><span class="tok${r.future ? ' tok--future' : ''}">${r.short}</span><span><span class="o">${r.org}</span><span class="rl">${r.role}, ${r.since}</span></span></li>`).join('');
  document.getElementById('suits').innerHTML = 'Suits: ' + Object.entries(KINDS).map(([k, v]) => `<span class="k-${k}">${v.label.toLowerCase()}</span>`).join('');
  const mon = (p) => { const m = p.when.replace(/^since /, '').match(/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/); return m ? m[1] : (p.to ? 'to ' + String(p.to).slice(2, 4) : ''); };
  document.getElementById('cards').innerHTML = byYearDesc(PAST).map((p) => `<li><a class="card k-${p.kind}" href="#" title="${esc(p.blurb)}">
      <span class="idx"><b>${String(p.year).slice(2)}</b><small>${mon(p)}</small></span>
      <span class="face"><img class="crest" src="${p.image}" alt=""><span class="t">${esc(p.title)}</span><span class="p">${esc(p.org)}${p.place ? ', ' + p.place : ''}</span><span class="r">${p.role}</span></span>
      <span class="idx idx--b"><b>${String(p.year).slice(2)}</b><small>${mon(p)}</small></span>
    </a></li>`).join('');
</script>
</body>
</html>
