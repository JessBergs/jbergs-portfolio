<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jess Bergs · Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  /* E · Timeline. The hero is a chart of the career: five lanes, one per kind of work, from 2011
     to next spring. Today is a line; what comes after it is drawn hollow. The last three years
     get most of the width because that is where most of the entries are. */
  :root { --sans: 'Instrument Sans', system-ui, sans-serif; }
  .top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2rem; align-items: end; padding-top: 3rem; padding-bottom: 1rem; }
  h1 { font-size: 2.7rem; line-height: 1.05; }
  .intro { max-width: 40rem; margin-top: 0.9rem; font-size: 1.08rem; line-height: 1.55; color: var(--ink-2); }
  .links { display: flex; flex-wrap: wrap; gap: 0.35rem 1.4rem; margin-top: 1.1rem; font-size: 0.95rem; }
  .legend { font-family: var(--sans); font-size: 0.82rem; color: var(--ink-2); display: grid; gap: 0.3rem; }
  .legend li { display: flex; align-items: center; gap: 0.5rem; }
  .legend .sw { width: 22px; height: 10px; border-radius: 5px; background: var(--wash); box-shadow: inset 0 0 0 1px var(--pen); }
  .legend .sw.open { background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--pen); }
  .chart { padding: 0.5rem 0 0; }
  .scroll { overflow-x: auto; }
  svg { display: block; width: 100%; min-width: 900px; height: auto; font-family: var(--sans); }
  .lane-l { font-family: var(--serif); font-size: 15px; fill: var(--ink); }
  .lane-g { stroke: var(--line); }
  .tick-l { font-size: 11px; fill: var(--ink-3); }
  .tick { stroke: var(--line-2); }
  .mark { stroke-width: 1; }
  .mark.open { stroke-width: 1.6; stroke-dasharray: 2.5 2; }
  .mark:hover { stroke-width: 2.2; }
  .ulabel { font-size: 12px; font-weight: 500; fill: var(--ink); }
  .ulabel small { font-weight: 400; fill: var(--ink-3); }
  .today-l { stroke: var(--ink); stroke-width: 1.2; }
  .today-t { font-family: var(--serif); font-style: italic; font-size: 13px; fill: var(--ink); }
  .leader { fill: none; stroke-width: 1; stroke-dasharray: 2 2; opacity: .8; }
  .below { display: grid; grid-template-columns: 1.2fr 1fr; gap: 3rem; padding: 1.75rem 0; border-top: 1px solid var(--line); margin-top: 1rem; }
  h2 { font-size: 1.2rem; margin-bottom: 0.6rem; }
  .list li { display: grid; grid-template-columns: 0.8rem minmax(0, 1fr); gap: 0.6rem; padding: 0.4rem 0; border-top: 1px solid var(--line); font-size: 1rem; align-items: baseline; }
  .list .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--wash); box-shadow: inset 0 0 0 1px var(--pen); align-self: center; }
  .list .dot.open { background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--pen); }
  .list b { font-weight: 700; }
  .list .m { color: var(--ink-2); }
  .lanes { padding: 0.5rem 0 2rem; }
  .lane { padding: 1.25rem 0 0.5rem; border-top: 1px solid var(--line); }
  .lane h2 { display: inline-block; padding-bottom: 0.15rem; border-bottom: 3px solid var(--wash); }
  .lane ul { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem 2rem; margin-top: 0.5rem; }
  .lane li a { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 0.7rem; align-items: center; padding: 0.35rem 0; text-decoration: none; }
  .lane img { width: 52px; height: 52px; object-fit: cover; border-radius: 6px; box-shadow: 0 0 0 1px var(--line); }
  .lane .t { font-size: 0.95rem; line-height: 1.3; }
  .lane small { display: block; font-size: 0.8rem; color: var(--ink-3); }
  footer { padding: 2rem 0; font-size: 0.85rem; color: var(--ink-3); }
  @media (max-width: 64rem) { .top { grid-template-columns: 1fr; align-items: start; } .legend { grid-template-columns: repeat(3, auto); justify-content: start; gap: 0.3rem 1rem; } .below { grid-template-columns: 1fr; } .lane ul { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 40rem) { h1 { font-size: 2.2rem; } .lane ul { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="wrap top">
  <div><h1>Jess Bergs</h1><p class="intro" id="intro"></p><p class="links" id="links"></p></div>
  <ul class="legend" id="legend"></ul>
</header>
<main class="wrap">
  <section class="chart" aria-label="Timeline of work, 2011 to 2027"><div class="scroll"><svg id="tl" viewBox="0 0 1120 372" role="img" aria-label="Five lanes of work from 2011 to early 2027; today is marked, upcoming items are hollow"></svg></div></section>
  <section class="below">
    <div><h2>Next</h2><ol class="list" id="next"></ol></div>
    <div><h2>Now</h2><ul class="list" id="now"></ul></div>
  </section>
  <section class="lanes" id="lanes"></section>
</main>
<footer class="wrap">© 2026 Jessica Bergs</footer>
<div class="mock-label">E · timeline</div>
<script src="entries.js"></script>
<script>
  document.getElementById('intro').textContent = INTRO;
  document.getElementById('links').innerHTML = linksHtml();
  document.getElementById('legend').innerHTML = Object.entries(KINDS).map(([k, v]) => `<li class="k-${k}"><span class="sw"></span>${v.label}</li>`).join('') + `<li><span class="sw open" style="--pen: var(--ink-3)"></span>Upcoming</li>`;

  const dec = (iso) => { const [y, m = 1, d = 1] = iso.split('-').map(Number); return y + (m - 1) / 12 + (d - 1) / 365; };
  const W = 1120, L = 92, R = 30, padTop = 126, laneH = 44;
  const lanes = Object.keys(KINDS);
  const Wp = W - L - R, brk = 2024, x0 = 2011, x1 = 2027.42;
  const x = (y) => (y < brk ? L + ((y - x0) / (brk - x0)) * Wp * 0.34 : L + Wp * 0.34 + ((y - brk) / (x1 - brk)) * Wp * 0.66);
  const ly = (k) => padTop + lanes.indexOf(k) * laneH + laneH / 2;
  const today = dec(TODAY);
  let s = '';
  lanes.forEach((k) => { s += `<line class="lane-g" x1="${L}" x2="${W - R}" y1="${ly(k)}" y2="${ly(k)}"/><text class="lane-l" x="0" y="${ly(k) + 5}">${KINDS[k].label}</text>`; });
  const axisY = padTop + lanes.length * laneH + 6;
  for (let y = 2011; y <= 2027; y++) { const major = y >= 2024 || (y < 2023 && (y - 2011) % 3 === 0); s += `<line class="tick" x1="${x(y)}" x2="${x(y)}" y1="${axisY}" y2="${axisY + (major ? 8 : 4)}"/>`; if (major) s += `<text class="tick-l" x="${x(y)}" y="${axisY + 22}" text-anchor="middle">${y}</text>`; }
  // standing roles as bars from their start to today (BlueDot and SPAR are already in the record)
  const roleBars = ROLES.filter((r) => !r.future && !['BlueDot Impact', 'SPAR'].includes(r.org));
  const laneCount = {};
  roleBars.forEach((r) => { const i = (laneCount[r.kind] = (laneCount[r.kind] || 0) + 1); const dy = (i - 1) * 7 - (r.kind === 'mentoring' ? 7 : 0); s += `<rect class="mark k-${r.kind}" x="${x(dec(r.from))}" y="${ly(r.kind) - 5 + dy}" width="${Math.max(6, x(today) - x(dec(r.from)))}" height="10" rx="5" style="fill: var(--wash); stroke: var(--pen)"><title>${esc(r.role)}, ${esc(r.org)}, ${r.since}</title></rect>`; });
  PAST.forEach((p) => {
    const xa = x(dec(p.iso));
    if (p.to) { const xb = x(dec(p.to)); s += `<rect class="mark k-${p.kind}" x="${xa}" y="${ly(p.kind) - 5}" width="${Math.max(8, xb - xa)}" height="10" rx="5" style="fill: var(--wash); stroke: var(--pen)"><title>${esc(p.title)}, ${p.when}</title></rect>`; }
    else s += `<circle class="mark k-${p.kind}" cx="${xa}" cy="${ly(p.kind)}" r="6" style="fill: var(--wash); stroke: var(--pen)"><title>${esc(p.title)}, ${p.when}</title></circle>`;
  });
  s += `<line class="today-l" x1="${x(today)}" x2="${x(today)}" y1="${padTop - 104}" y2="${axisY}"/><text class="today-t" x="${x(today)}" y="${axisY + 40}" text-anchor="middle">today</text>`;
  // upcoming: hollow marks, labelled in a column left of the today line, latest at the top, elbow leaders
  const rowY = (i) => padTop - 100 + i * 16;
  const ups = [...UPCOMING].sort((a, b) => (a.iso < b.iso ? 1 : -1));
  const short = (t) => t.replace('Vrije Universiteit Brussel', 'VUB Brussels').replace('AI safety social at NeurIPS', 'NeurIPS social').replace('Pivotal AI Safety Fellowship', 'Pivotal fellowship');
  ups.forEach((e, i) => {
    const xa = x(dec(e.iso)); const y = ly(e.kind); const ry = rowY(i);
    if (e.day === 'Q1') s += `<rect class="mark open k-${e.kind}" x="${xa - 8}" y="${y - 5}" width="${x(dec('2027-04-01')) - xa + 8}" height="10" rx="5" style="fill: var(--paper); stroke: var(--pen)"/>`;
    else s += `<circle class="mark open k-${e.kind}" cx="${xa}" cy="${y}" r="6" style="fill: var(--paper); stroke: var(--pen)"/>`;
    s += `<polyline class="leader k-${e.kind}" points="${xa},${y - 7} ${xa},${ry + 4} ${x(today) - 10},${ry + 4}" style="stroke: var(--pen)"/>`;
    s += `<text class="ulabel" x="${x(today) - 16}" y="${ry + 8}" text-anchor="end"><tspan style="fill: var(--ink-3)">${e.date}</tspan>  ${esc(short(e.title))}, ${e.role.toLowerCase()}${e.tbc ? ' (tbc)' : ''}</text>`;
  });
  document.getElementById('tl').innerHTML = s;

  document.getElementById('next').innerHTML = UPCOMING.map((e) => `<li class="k-${e.kind}"><span class="dot open"></span><span><b>${e.date}</b> ${esc(e.title)}<span class="m">, ${e.role}${e.place ? ', ' + e.place : ''}${e.tbc ? ', date tbc' : ''}</span></span></li>`).join('');
  document.getElementById('now').innerHTML = ROLES.map((r) => `<li class="k-${r.kind}"><span class="dot${r.future ? ' open' : ''}"></span><span><b>${esc(r.org)}</b><span class="m">, ${r.role}, ${r.since}</span></span></li>`).join('');
  document.getElementById('lanes').innerHTML = lanes.map((k) => { const items = byYearDesc(PAST).filter((p) => p.kind === k); return items.length ? `<section class="lane k-${k}"><h2>${KINDS[k].label}</h2><ul>${items.map((p) => `<li><a href="#" title="${esc(p.blurb)}"><img src="${p.image}" alt=""><span class="t">${esc(p.title)}<small>${p.role}, ${esc(p.org)}${p.place ? ', ' + p.place : ''}, ${p.when}</small></span></a></li>`).join('')}</ul></section>` : ''; }).join('');
</script>
</body>
</html>
