<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jess Bergs</title>
<link rel="stylesheet" href="base.css">
<style>
  /* A. Two columns, the way most researcher pages are built: identity pinned on the left,
     a prose bio, selected work as a thumbnail list, and dated lists for what is next and
     what just happened. One typeface, one link colour. */
  body { font-size: 17.5px; }
  .page { display: grid; grid-template-columns: 15rem minmax(0, 40rem); column-gap: 4.5rem; max-width: 64rem; margin: 0 auto; padding: 4.5rem 2.5rem 5rem; }
  .side { position: sticky; top: 3.5rem; align-self: start; }
  .side img { width: 11rem; height: auto; aspect-ratio: 1; object-fit: cover; object-position: 50% 30%; border-radius: 2px; filter: grayscale(1) contrast(1.05); }
  .side h1 { font-size: 1.9rem; letter-spacing: -0.01em; margin-top: 1.4rem; line-height: 1.1; }
  .side .role { margin-top: .5rem; color: var(--ink-2); font-size: .98rem; line-height: 1.35; }
  .side .where { margin-top: .45rem; color: var(--ink-3); font-size: .9rem; }
  .side nav { margin-top: 1.4rem; display: flex; flex-direction: column; gap: .35rem; font-size: .95rem; }
  a { color: var(--sky-pen); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .main > * + * { margin-top: 2.6rem; }
  .bio p { line-height: 1.58; }
  .bio p + p { margin-top: 1rem; }
  h2 { font-size: 1.45rem; letter-spacing: -0.005em; padding-top: 1.6rem; border-top: 1px solid var(--line); margin-bottom: 1.1rem; }
  h2 small { font-size: .9rem; color: var(--ink-3); margin-left: .6rem; letter-spacing: 0; }

  /* dated lists: date in the gutter, text on the right */
  .dated { display: grid; grid-template-columns: 5.5rem 1fr; row-gap: .55rem; column-gap: 1rem; }
  .dated .d { color: var(--ink-3); font-size: .9rem; padding-top: .12rem; }
  .dated .t { line-height: 1.45; }
  .dated .t .role { color: var(--pen); }
  .dated .t .place { color: var(--ink-3); }
  .dated .t .tbc { color: var(--ink-3); font-style: italic; }
  .dated .t b { font-weight: 700; }

  /* the thumbnail list */
  .work { display: flex; flex-direction: column; gap: 1.9rem; }
  .item { display: grid; grid-template-columns: 10rem 1fr; column-gap: 1.4rem; }
  .item figure { aspect-ratio: 16/10; overflow: hidden; border-radius: 2px; border: 1px solid var(--line); background: var(--wash); }
  .item img { width: 100%; height: 100%; object-fit: cover; }
  .item h3 { font-size: 1.08rem; font-weight: 700; line-height: 1.3; }
  .item .meta { color: var(--ink-2); font-size: .95rem; margin-top: .15rem; }
  .item .blurb { color: var(--ink-3); font-size: .95rem; margin-top: .3rem; line-height: 1.45; }
  .item .venue { margin-top: .4rem; font-size: .9rem; color: var(--pen); font-weight: 700; }
  .item .venue span { color: var(--ink-3); font-weight: 400; margin-left: .7rem; }

  .roles { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem 2rem; }
  .roles li { display: grid; grid-template-columns: 1fr; line-height: 1.35; }
  .roles .org { font-weight: 700; }
  .roles .r { color: var(--ink-2); font-size: .95rem; }
  .roles .r i { color: var(--ink-3); }
  .more { margin-top: .9rem; font-size: .95rem; }
  .updated { color: var(--ink-3); font-size: .88rem; margin-top: 3rem; }

  @media (max-width: 52rem) {
    .page { grid-template-columns: 1fr; padding: 2.5rem 1.25rem 4rem; row-gap: 2rem; }
    .side { position: static; }
    .side img { width: 6.5rem; }
    .roles { grid-template-columns: 1fr; }
    .item { grid-template-columns: 6rem 1fr; }
  }
</style>
</head>
<body>
<div class="page">
  <aside class="side">
    <img src="../../../public/images/profile.png" alt="Jess Bergs" width="462" height="456">
    <h1>Jess Bergs</h1>
    <p class="role">Engineering lead, Human-AI Interaction<br>UK AI Security Institute</p>
    <p class="where">London</p>
    <nav id="links"></nav>
  </aside>
  <main class="main">
    <section class="bio" id="bio"></section>
    <section>
      <h2>Upcoming</h2>
      <div class="dated" id="upcoming"></div>
    </section>
    <section>
      <h2>Selected work <small>research, talks and projects</small></h2>
      <div class="work" id="work"></div>
      <p class="more"><a href="#">Everything since 2011 (20 entries)</a></p>
    </section>
    <section>
      <h2>Updates</h2>
      <div class="dated" id="updates"></div>
      <p class="more"><a href="#">Show more</a></p>
    </section>
    <section>
      <h2>Mentoring and service</h2>
      <ul class="roles" id="roles"></ul>
    </section>
    <p class="updated">Last updated November 2026.</p>
  </main>
</div>
<span class="mock-label">A · two columns</span>
<script src="entries.js"></script>
<script>
  document.getElementById('links').innerHTML = linksHtml();
  document.getElementById('bio').innerHTML = BIO.map((p) => `<p>${p}</p>`).join('');
  document.getElementById('upcoming').innerHTML = UPCOMING.map((u) => `
    <div class="d">${esc(u.date)}</div>
    <div class="t k-${u.kind}"><span class="role">${esc(u.role)}</span>, <b>${esc(u.title)}</b>${u.place ? `<span class="place">, ${esc(u.place)}</span>` : ''}${u.tbc ? ' <span class="tbc">date to be confirmed</span>' : ''}${u.note ? ` <span class="tbc">${esc(u.note)}</span>` : ''}</div>`).join('');
  const picks = ['arxiv-political-knowledge', 'spar-auditing-games-debate', 'arxiv-ai-advice', 'aisi-future-of-work', 'chi-staig-2025', 'bbc-explainable-ai'];
  document.getElementById('work').innerHTML = picks.map((id) => PAST.find((p) => p.id === id)).map((p) => `
    <article class="item k-${p.kind}">
      <figure><img src="${p.image}" alt="" loading="lazy"></figure>
      <div>
        <h3>${esc(p.title)}</h3>
        <p class="meta">${esc(p.role)}, ${esc(p.org)}${p.place ? ', ' + esc(p.place) : ''}</p>
        <p class="blurb">${esc(p.blurb)}</p>
        <p class="venue">${esc(p.venue || KINDS[p.kind].one)}<span>${esc(p.when)}</span></p>
      </div>
    </article>`).join('');
  document.getElementById('updates').innerHTML = UPDATES.map((u) => `<div class="d">${esc(u.when)}</div><div class="t">${u.text}</div>`).join('');
  document.getElementById('roles').innerHTML = ROLES.filter((r) => r.kind !== 'research').map((r) => `
    <li class="k-${r.kind}"><span class="org">${esc(r.org)}</span><span class="r">${esc(r.role)} <i>· ${r.future ? esc(r.since) : 'since ' + esc(r.since)}</i></span></li>`).join('');
</script>
</body>
</html>
